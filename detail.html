<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Detail</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <base href="./">
</head>
<body>
  <!-- Theme and Language Toggle -->
  <div class="controls-container">
    <div class="language-toggle-container">
      <button class="language-toggle" id="language-toggle" aria-label="Toggle language">
        <span class="language-icon">🇩🇪</span>
      </button>
    </div>
    <div class="theme-toggle-container">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="toggle-icon">🌙</span>
      </button>
    </div>
  </div>
  <header class="detail-header">
    <div class="container detail-bar">
      <a class="back-link" href="./index.html" aria-label="Back to projects" data-en="← Back" data-de="← Zurück">← Back</a>
      <h1 id="project-title" data-en="Project" data-de="Projekt">Project</h1>
    </div>
  </header>

  <main class="container">
    <div id="detail-root" class="detail-root" aria-live="polite"></div>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/detail.js" defer></script>

  <!-- Dark Mode JavaScript -->
  <script>
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', function() {
      // Theme toggle functionality
      const themeToggle = document.getElementById('theme-toggle');
      const languageToggle = document.getElementById('language-toggle');
      const body = document.body;
      
      // Function to get system preference
      function getSystemPreference() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      
      // Function to get initial theme (saved preference or system preference)
      function getInitialTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
          return savedTheme;
        }
        return getSystemPreference();
      }
      
      // Initialize theme
      const currentTheme = getInitialTheme();
      console.log('Detail page initial theme:', currentTheme); // Debug log
      body.setAttribute('data-theme', currentTheme);
      updateThemeIcon(currentTheme);
      
      // Listen for system theme changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        // Only auto-switch if user hasn't manually set a preference
        if (!localStorage.getItem('theme')) {
          const systemTheme = e.matches ? 'dark' : 'light';
          body.setAttribute('data-theme', systemTheme);
          updateThemeIcon(systemTheme);
        }
      });
      
      // Manual toggle functionality
      themeToggle.addEventListener('click', () => {
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme); // Save manual preference
        updateThemeIcon(newTheme);
      });
      
      function updateThemeIcon(theme) {
        const icon = themeToggle.querySelector('.toggle-icon');
        
        if (icon) {
          icon.textContent = theme === 'light' ? '🌙' : '☀️';
        }
      }

      // Language functionality
      function getInitialLanguage() {
        const savedLanguage = localStorage.getItem('language');
        if (savedLanguage) {
          return savedLanguage;
        }
        return 'en'; // Default to English
      }

      const currentLanguage = getInitialLanguage();
      console.log('Detail page initial language:', currentLanguage);
      body.setAttribute('data-language', currentLanguage);
      updateLanguageIcon(currentLanguage);
      updateContent(currentLanguage);

      languageToggle.addEventListener('click', () => {
        const currentLanguage = body.getAttribute('data-language');
        const newLanguage = currentLanguage === 'en' ? 'de' : 'en';
        body.setAttribute('data-language', newLanguage);
        localStorage.setItem('language', newLanguage);
        updateLanguageIcon(newLanguage);
        updateContent(newLanguage);
      });

      function updateLanguageIcon(language) {
        const icon = languageToggle.querySelector('.language-icon');
        if (icon) {
          icon.textContent = language === 'en' ? '🇩🇪' : '🇬🇧';
        }
      }

      function updateContent(language) {
        const elements = document.querySelectorAll('[data-en][data-de]');
        elements.forEach(element => {
          const text = element.getAttribute(`data-${language}`);
          if (text) {
            element.textContent = text;
          }
        });
      }
    });
  </script>
</body>
</html>
